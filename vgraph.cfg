# Dependency directions checked by `nimble checkVGraph`. See ADR-0001.

# Layers inside src/, lowest first. A module may import its own layer and any
# lower one, never a higher one. A name matches a file (crc32 -> crc32.nim) or
# a directory (types -> types/*.nim). Modules under no listed layer are
# unconstrained: the umbrella module re-exports everything. The three checksum
# families are independent and import nothing from each other; only the C ABI
# sits above them.
[layers]
adler32
crc32
crc64
c_api

# Uni* engines this repo may name in `requires`. Any Uni* absent here is a
# back-edge in the family DAG. Non-Uni deps (nim, NimContracts) are external
# infra and go unchecked. UniChecksum is layer 1: it depends on no sibling.
[engines]
